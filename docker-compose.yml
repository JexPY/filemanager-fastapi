services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "9000:80"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_STORAGE_DIR=/data/media
    volumes:
      - media_data:/data/media
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_STORAGE_DIR=/data/media
    volumes:
      - media_data:/data/media
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  imgproxy:
    image: darthsim/imgproxy:latest
    ports:
      - "8080:8080"
    environment:
      # Hex-encoded strings; must match the app's IMGPROXY_KEY/IMGPROXY_SALT
      # exactly. No fallback default here on purpose: a blank .env value
      # used to silently become "0000" for imgproxy while staying "" for the
      # app, so every signed URL 403'd until someone noticed the mismatch.
      - IMGPROXY_KEY=${IMGPROXY_KEY:?IMGPROXY_KEY must be set, e.g. via `openssl rand -hex 32`}
      - IMGPROXY_SALT=${IMGPROXY_SALT:?IMGPROXY_SALT must be set, e.g. via `openssl rand -hex 32`}
      # Enables the local:///<key> source scheme for STORAGE_BACKEND=local --
      # without this (and the matching volume mount below), imgproxy has no
      # way to reach locally-stored objects at all.
      - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/data/media
    volumes:
      - media_data:/data/media:ro

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_STORAGE_DIR=/data/media
      # Fixed test-only values so the suite never depends on the developer's
      # own .env being populated correctly.
      - FILE_MANAGER_BEARER_TOKENS=test-token
      - IMGPROXY_KEY=00112233445566778899aabbccddeeff00112233445566778899aabbccddee
      - IMGPROXY_SALT=aabbccddeeff00112233445566778899aabbccddeeff0011223344556677aa
    volumes:
      - media_data:/data/media
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["test"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["s3-dev"]

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/filemanager-test
      "
    profiles: ["s3-dev"]

volumes:
  media_data:
