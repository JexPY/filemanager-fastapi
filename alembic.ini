# Alembic configuration for the `uploads` metadata schema.
#
# The database URL is NOT set here on purpose: migrations/env.py reads it from
# the DATABASE_URL environment variable (the same var the app uses) so there is
# a single source of truth and no secret ever lands in a committed file.
[alembic]
script_location = migrations
prepend_sys_path = .
# Store revisions as plain zero-padded sequence ids (0001, 0002, ...) rather
# than random hashes, so the ordering is obvious at a glance in a small,
# linear history.
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
