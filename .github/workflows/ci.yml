name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # docker-compose.yml's env_file: .env directives (and the imgproxy
      # service's required ${IMGPROXY_KEY:?...} interpolation, which Compose
      # validates for every service regardless of which one is actually run)
      # both need a .env file to exist. .env is gitignored/never committed,
      # so CI provisions one from the example -- the test service's own
      # environment: block overrides the auth/imgproxy values that actually
      # matter for the test run.
      - name: Provision .env for docker compose
        run: cp .env-example .env

      - name: Build test image
        run: docker compose build test

      # Garage is the live S3-compatible target for the s3_integration tests
      # (multipart upload, presigned GET, Range).
      #
      # `--wait` covers only the long-running services. It must NOT be given
      # garage-init: `up --wait` treats a container that *exits* as a failure
      # even when it exits 0, so including the one-shot gate made this step
      # return 1 while every container was healthy and the gate had succeeded.
      #
      # The gate still has to run -- garage's own healthcheck shells out to
      # `garage status`, which only proves the RPC layer is up, not that the S3
      # API is serving. `run --rm` propagates the container's exit code, so a
      # cluster that never becomes operational fails this step rather than
      # surfacing later as a confusing S3 test failure.
      - name: Start Postgres, Redis + Garage (s3-dev profile)
        run: docker compose --profile s3-dev up -d --wait db redis garage

      - name: Wait for the Garage cluster to be operational
        run: docker compose --profile s3-dev run --rm garage-init

      - name: Lint (ruff check)
        run: docker compose run --rm test ruff check .

      - name: Format check (ruff format)
        run: docker compose run --rm test ruff format --check .

      - name: Type check (mypy)
        run: docker compose run --rm test mypy app

      # S3_INTEGRATION_REQUIRED turns the "no live endpoint" skip into a
      # failure, so a Garage service that failed to come up cannot quietly
      # reduce this to a green run with zero S3 coverage.
      - name: Tests (pytest)
        run: docker compose run --rm -e S3_INTEGRATION_REQUIRED=1 test pytest -v

      - name: Tear down
        if: always()
        run: docker compose --profile s3-dev --profile test down -v
