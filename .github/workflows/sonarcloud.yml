name: SonarCloud

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history required for SonarCloud blame information
          fetch-depth: 0

      - name: Provision .env for docker compose
        run: cp .env-example .env

      - name: Build test image & run pytest with coverage
        run: |
          docker compose build test
          docker compose --profile s3-dev up -d --wait db redis garage garage-init
          docker compose run --name test-runner test pytest --cov=app --cov-report=xml:coverage.xml
          docker cp test-runner:/app/coverage.xml ./coverage.xml
          docker rm -f test-runner
          sed -i 's|/app/app|app|g' coverage.xml || true
          sed -i 's|/app/|./|g' coverage.xml || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Tear down
        if: always()
        run: docker compose --profile s3-dev --profile test down -v
