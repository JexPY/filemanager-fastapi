name: Trivy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly scan every Tuesday at 06:00 UTC
    - cron: "0 6 * * 2"

jobs:
  filesystem:
    name: Trivy — Filesystem & Dependencies
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan (dependencies + secrets)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: "trivy-fs.sarif"
          category: "trivy-filesystem"
        continue-on-error: true

  config:
    name: Trivy — Dockerfile Misconfiguration
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy config scan (Dockerfiles)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-config.sarif"
          exit-code: "0"

      - name: Upload Trivy config SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: "trivy-config.sarif"
          category: "trivy-config"
        continue-on-error: true
