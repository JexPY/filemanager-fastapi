sonar.projectKey=JexPY_filemanager-fastapi
sonar.organization=jexpy

# Source and test directories
sonar.sources=app
sonar.tests=tests

# Python version
sonar.python.version=3.14

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions — don't scan migrations boilerplate or generated files
sonar.exclusions=migrations/**,**/__pycache__/**,**/*.pyc

# Disable automatic analysis so GitHub Action scanner runs without conflict
sonar.auto-analysis=disabled

# Coverage report location
sonar.python.coverage.reportPaths=coverage.xml

